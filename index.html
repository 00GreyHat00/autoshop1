<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AutoShop</title>

  <!-- SDK Telegram Mini App (obligatoire) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= ÉCRAN DE CHARGEMENT ================= -->
  <div id="loader" class="loader">
    <div class="loader-logo">🛒</div>
    <div class="loader-spinner"></div>
    <p class="loader-text">Chargement de la boutique…</p>
  </div>

  <!-- ================= APPLICATION ================= -->
  <div id="app" class="app hidden">

    <!-- ---------- HEADER ---------- -->
    <header class="header fade-item">
      <div class="header-left">
        <span class="shop-logo">🛒</span>
        <span class="shop-name" id="shop-name">AutoShop</span>
      </div>
      <div class="header-right">
        <!-- Solde du portefeuille -->
        <button class="wallet-chip" id="wallet-btn">
          <span id="wallet-balance">0.00</span>&nbsp;<span id="wallet-currency">€</span>
        </button>
        <!-- Bouton thème sombre / clair -->
        <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- ---------- ONGLETS ---------- -->
    <nav class="tabs fade-item">
      <button class="tab active" data-tab="script">⚙️ Script</button>
      <button class="tab" data-tab="liste">📄 Liste</button>
    </nav>

    <!-- ---------- CONTENU DES ONGLETS ---------- -->
    <main class="content">
      <!-- Les annonces sont générées automatiquement depuis js/config.js -->
      <section id="tab-script" class="tab-panel active"></section>
      <section id="tab-liste" class="tab-panel"></section>
    </main>

    <!-- ---------- PIED DE PAGE ---------- -->
    <footer class="footer fade-item">
      <p id="footer-text">Livraison instantanée • Paiement crypto</p>
    </footer>
  </div>

  <!-- ================= MODALE PRODUIT ================= -->
  <div id="product-modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal>✕</button>
      <div class="modal-emoji" id="modal-emoji">📦</div>
      <h2 id="modal-title">Produit</h2>
      <p id="modal-description">Description</p>
      <div class="modal-stock" id="modal-stock"></div>

      <!-- Options (générées automatiquement) -->
      <div id="modal-options"></div>

      <!-- Quantité -->
      <div class="quantity-row" id="quantity-row">
        <span>Quantité</span>
        <div class="quantity-controls">
          <button id="qty-minus">−</button>
          <span id="qty-value">1</span>
          <button id="qty-plus">+</button>
        </div>
      </div>

      <div class="modal-total">
        Total : <strong id="modal-total-price">0.00 €</strong>
      </div>

      <button class="btn btn-primary btn-full" id="buy-btn">Acheter</button>
    </div>
  </div>

  <!-- ================= MODALE PORTEFEUILLE ================= -->
  <div id="wallet-modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal>✕</button>
      <h2>💳 Mon portefeuille</h2>
      <div class="wallet-balance-big">
        <span id="wallet-modal-balance">0.00</span> <span id="wallet-modal-currency">€</span>
      </div>

      <h3 class="wallet-subtitle">Recharger avec :</h3>
      <div class="crypto-grid" id="crypto-grid">
        <!-- Boutons crypto générés depuis config.js -->
      </div>

      <!-- Étape 2 : montant -->
      <div id="topup-step" class="topup-step hidden">
        <label for="topup-amount">Montant à recharger (€)</label>
        <input type="number" id="topup-amount" min="1" step="1" placeholder="Ex : 25" />
        <p class="crypto-eta" id="crypto-eta"></p>
        <button class="btn btn-primary btn-full" id="topup-btn">Générer l'adresse de dépôt</button>
      </div>

      <!-- Étape 3 : adresse de dépôt -->
      <div id="deposit-step" class="deposit-step hidden">
        <p class="deposit-label">Envoyez <strong id="deposit-amount"></strong> à :</p>
        <div class="deposit-address" id="deposit-address">…</div>
        <button class="btn btn-secondary btn-full" id="copy-address-btn">📋 Copier l'adresse</button>
        <p class="deposit-note">✅ Confirmation automatique — votre solde sera crédité dès validation sur la blockchain.</p>
      </div>
    </div>
  </div>

  <!-- ================= TOAST (notifications) ================= -->
  <div id="toast" class="toast hidden"></div>

  <!-- La configuration D'ABORD, puis la logique -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
